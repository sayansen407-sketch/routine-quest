<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routine Quest</title>
  
  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --primary: #38bdf8;
      --text: #f8fafc;
      --sub: #94a3b8;
      --border: #1e293b;
      --earn: #10b981;
      --spend: #f43f5e;
    }

    body.theme-amoled { --bg: #000000; --card: #0a0a0a; --border: #222222; }
    body.theme-slate { --bg: #0f172a; --card: #1e293b; --border: #334155; }
    body.theme-light { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --sub: #64748b; --border: #e2e8f0; }
    body.theme-warm { --bg: #faf7f2; --card: #ffffff; --text: #292524; --sub: #78716c; --border: #e7e5e4; }
    body.theme-nordic { --bg: #eef2f6; --card: #ffffff; --text: #1e293b; --sub: #64748b; --border: #cbd5e1; }
    body.theme-crimson { --bg: #0d0204; --card: #170408; --border: #4c0519; --primary: #f43f5e; }
    body.theme-emerald { --bg: #020d09; --card: #041c16; --border: #064e3b; --primary: #10b981; }
    body.theme-purple { --bg: #0a0514; --card: #170b2c; --border: #3b0764; --primary: #a855f7; }
    body.theme-amber { --bg: #0f0701; --card: #1c0a02; --border: #451a03; --primary: #f59e0b; }
    body.theme-cyan { --bg: #020f0f; --card: #051d1d; --border: #042f2e; --primary: #14b8a6; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 70px; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .header-left, .header-right { display: flex; align-items: center; gap: 8px; }
    .user-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

    .nav-tabs { display: flex; overflow-x: auto; background: var(--card); border-bottom: 1px solid var(--border); padding: 6px 12px; gap: 8px; }
    .tab-btn { background: none; border: none; color: var(--sub); padding: 6px 12px; font-weight: 600; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 0.85rem; }
    .tab-btn.active { color: var(--primary); background: rgba(56, 189, 248, 0.1); }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    
    .btn { background: var(--primary); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; text-align: center; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--spend); color: #fff; }
    
    input, select, textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; }
    
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal.active { display: flex; }
    .modal-body { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 400px; padding: 16px; max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    
    .item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border); }
    .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); }
    .del { background: none; border: none; color: var(--spend); cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div id="userInfo" style="display:flex; align-items:center; gap:6px; font-size:0.85rem;">
        <span>🔒 Guest</span>
      </div>
      <button class="btn btn-outline" id="authBtn" onclick="toggleAuth()" style="padding:4px 8px; font-size:0.75rem;">Login</button>
    </div>
    <div class="header-right">
      <select id="saveSelector" onchange="switchProfile(this.value)" style="width:auto; margin:0; padding:4px 8px; font-size:0.75rem;"></select>
      <button class="btn btn-outline" onclick="openModal('manageModal')" style="padding:4px 8px; font-size:0.75rem;">⚙️</button>
      <button class="btn btn-outline" onclick="openModal('themeModal')" style="padding:4px 8px; font-size:0.75rem;">🎨</button>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('tabQuests')">Quests</button>
    <button class="tab-btn" onclick="switchTab('tabLogs')">History</button>
    <button class="tab-btn" onclick="switchTab('tabAnalytics')">Analytics</button>
    <button class="tab-btn" onclick="switchTab('tabNotes')">Notes</button>
    <button class="tab-btn" onclick="switchTab('tabRates')">Rates</button>
    <button class="tab-btn" onclick="switchTab('tabLevels')">Levels</button>
  </div>

  <div class="container">
    <!-- Top Stats -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
      <div class="card" style="margin:0; text-align:center;">
        <small style="color:var(--sub); font-size:0.75rem;">Balance</small>
        <h3 id="walletBalance" style="color:var(--primary); margin-top:4px;">₹ 0.00</h3>
      </div>
      <div class="card" style="margin:0; text-align:center;">
        <small style="color:var(--sub); font-size:0.75rem;">Current Streak</small>
        <h3 id="streakBadge" style="margin-top:4px;">🔥 0 Days</h3>
      </div>
    </div>

    <!-- Tab 1: Quests -->
    <div id="tabQuests" class="tab-content">
      <div class="card">
        <h4 style="margin-bottom:10px;">Quick Quest</h4>
        <form id="formQuest" onsubmit="handleQuestSubmit(event)">
          <select id="selectQuestAct" required></select>
          <input type="number" id="questQty" placeholder="Units / Duration" required min="1" step="any">
          <button type="submit" class="btn" style="width:100%;">Complete Quest</button>
        </form>
      </div>

      <div class="card">
        <h4>Active Quests</h4>
        <div id="listPendingQuests" style="margin-top:10px;"></div>
      </div>
    </div>

    <!-- Tab 2: Logs -->
    <div id="tabLogs" class="tab-content" style="display:none;">
      <div class="card">
        <h4>Recent History</h4>
        <div id="listHistory" style="margin-top:10px;"></div>
      </div>
    </div>

    <!-- Tab 3: Analytics -->
    <div id="tabAnalytics" class="tab-content" style="display:none;">
      <div class="card">
        <h4>Performance Trend</h4>
        <canvas id="trendChart" style="max-height:200px; margin-top:10px;"></canvas>
      </div>
    </div>

    <!-- Tab 4: Notes -->
    <div id="tabNotes" class="tab-content" style="display:none;">
      <div class="card">
        <form id="formNote" onsubmit="handleNoteSubmit(event)">
          <input type="text" id="noteTitle" placeholder="Note Title" required>
          <textarea id="noteContent" placeholder="Take a note..." rows="3" required></textarea>
          <button type="submit" class="btn" style="width:100%;">Save Note</button>
        </form>
      </div>
      <div id="notesContainer"></div>
    </div>

    <!-- Tab 5: Rates -->
    <div id="tabRates" class="tab-content" style="display:none;">
      <div class="card">
        <h4>Manage Activity Rates</h4>
        <div id="listRates" style="margin-top:10px;"></div>
      </div>
    </div>

    <!-- Tab 6: Levels -->
    <div id="tabLevels" class="tab-content" style="display:none;">
      <div class="card">
        <h4>Rank Progression</h4>
        <div id="listLevels" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <!-- Appearance & Themes Modal -->
  <div class="modal" id="themeModal">
    <div class="modal-body">
      <div class="modal-header">
        <h4>Appearance & Themes</h4>
        <button class="btn btn-outline" onclick="closeModal('themeModal')" style="padding:2px 8px;">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn" style="background:#070d19; color:#38bdf8; border:1px solid #1e293b;" onclick="setTheme('default'); closeModal('themeModal');">Deep Neon (Default)</button>
        <button class="btn" style="background:#000; color:#fff; border:1px solid #333;" onclick="setTheme('theme-amoled'); closeModal('themeModal');">Pure AMOLED</button>
        <button class="btn" style="background:#1e293b; color:#94a3b8; border:1px solid #334155;" onclick="setTheme('theme-slate'); closeModal('themeModal');">Slate Minimal</button>
        <button class="btn" style="background:#fff; color:#0f172a; border:1px solid #cbd5e1;" onclick="setTheme('theme-light'); closeModal('themeModal');">Clean Paper</button>
        <button class="btn" style="background:#faf7f2; color:#292524; border:1px solid #e7e5e4;" onclick="setTheme('theme-warm'); closeModal('themeModal');">Warm Coffee</button>
        <button class="btn" style="background:#eef2f6; color:#1e293b; border:1px solid #cbd5e1;" onclick="setTheme('theme-nordic'); closeModal('themeModal');">Nordic Soft</button>
        <button class="btn" style="background:#170408; color:#f43f5e; border:1px solid #881337;" onclick="setTheme('theme-crimson'); closeModal('themeModal');">Crimson Dark</button>
        <button class="btn" style="background:#041c16; color:#10b981; border:1px solid #064e3b;" onclick="setTheme('theme-emerald'); closeModal('themeModal');">Emerald Forest</button>
        <button class="btn" style="background:#170b2c; color:#a855f7; border:1px solid #581c87;" onclick="setTheme('theme-purple'); closeModal('themeModal');">Midnight Purple</button>
        <button class="btn" style="background:#1c0a02; color:#f59e0b; border:1px solid #78350f;" onclick="setTheme('theme-amber'); closeModal('themeModal');">Amber Glow</button>
        <button class="btn" style="background:#051d1d; color:#14b8a6; border:1px solid #134e4a;" onclick="setTheme('theme-cyan'); closeModal('themeModal');">Cyber Cyan</button>
      </div>
    </div>
  </div>

  <!-- Manage Profile Modal -->
  <div class="modal" id="manageModal">
    <div class="modal-body">
      <div class="modal-header">
        <h4>Manage Profiles</h4>
        <button class="btn btn-outline" onclick="closeModal('manageModal')" style="padding:2px 8px;">✕</button>
      </div>
      <input type="text" id="newProfileName" placeholder="New Profile Name">
      <button class="btn" onclick="addProfile()" style="width:100%; margin-bottom:12px;">Create Profile</button>
      <div id="manageProfilesList"></div>
    </div>
  </div>
    <script>
    // --- Firebase Initialization ---
    const firebaseConfig = {
      apiKey: "AIzaSyDZ7JwsMsB4KERLbq2Nrzwm17Bq4LxVsQY",
      authDomain: "routine-quest-8613f.firebaseapp.com",
      projectId: "routine-quest-8613f",
      storageBucket: "routine-quest-8613f.firebasestorage.app",
      messagingSenderId: "461797030515",
      appId: "1:461797030515:web:071645a001e08f228a4806",
      measurementId: "G-JW5KHNGRC8"
    };

    let auth = null, db = null, currentUser = null;
    try {
      if (firebase.apps.length === 0) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.log("Firebase init skipped/offline mode:", e);
    }

    // --- State Defaults ---
    const defaultState = {
      activeProfile: "Default",
      theme: "default",
      profiles: {
        "Default": {
          balance: 0,
          streak: 0,
          lastActiveDate: "",
          acts: [
            { id: 1, name: "Focus Work", type: "Earn", rate: 50, unit: "hr" },
            { id: 2, name: "Reading", type: "Earn", rate: 20, unit: "hr" },
            { id: 3, name: "Distraction", type: "Spend", rate: 30, unit: "hr" }
          ],
          lvls: [
            { lvl: 1, title: "Novice", target: 500 },
            { lvl: 2, title: "Disciplined", target: 1500 },
            { lvl: 3, title: "Master", target: 3500 }
          ],
          quests: [],
          logs: [],
          notes: []
        }
      }
    };

    let store = JSON.parse(localStorage.getItem('rq_db')) || defaultState;

    function persist() {
      localStorage.setItem('rq_db', JSON.stringify(store));
      if (currentUser && db) {
        db.collection("users").doc(currentUser.uid).set(store).catch(console.error);
      }
    }

    function getCur() {
      if (!store.profiles || typeof store.profiles !== 'object') store.profiles = { "Default": defaultState.profiles.Default };
      if (!store.activeProfile || !store.profiles[store.activeProfile]) store.activeProfile = Object.keys(store.profiles)[0] || "Default";
      return store.profiles[store.activeProfile];
    }

    // --- Theme Handling ---
    function setTheme(t) {
      store.theme = t;
      document.body.className = t === 'default' ? '' : t;
      persist();
    }

    // --- Navigation & UI ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      event.target.classList.add('active');
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
          function updateUI() {
      const cur = getCur();

      // Clean invalid profiles
      if (store.profiles) {
        delete store.profiles["undefined"];
        delete store.profiles["null"];
        delete store.profiles["1"];
        delete store.profiles[""];
      }

      // Populate Profiles Dropdown
      const validProfiles = Object.keys(store.profiles || {}).filter(k => k && k !== "undefined" && k !== "null" && k !== "1");
      const selector = document.getElementById('saveSelector');
      selector.innerHTML = validProfiles.map(k => `<option value="${k}" ${k === store.activeProfile ? 'selected' : ''}>${k}</option>`).join('');

      // Top Badges
      document.getElementById('walletBalance').innerText = `₹ ${(cur.balance || 0).toFixed(2)}`;
      document.getElementById('streakBadge').innerText = `🔥 ${cur.streak || 0} Days`;

      // Select Quest Activities
      const actSelect = document.getElementById('selectQuestAct');
      actSelect.innerHTML = (cur.acts || []).map(a => `<option value="${a.id}">${a.name} (${a.type === 'Earn' ? '+' : '-'}₹${a.rate}/${a.unit})</option>`).join('');

      // Render History
      document.getElementById('listHistory').innerHTML = (cur.logs || []).slice(0, 10).map(l => `
        <div class="item">
          <div><strong>${l.name}</strong><br><small style="color:var(--sub); font-size:0.75rem;">${l.time}</small></div>
          <span style="color:${l.type === 'Earn' ? 'var(--earn)' : 'var(--spend)'}; font-weight:bold;">${l.type === 'Earn' ? '+' : '-'}₹${l.amount}</span>
        </div>
      `).join('') || '<p style="text-align:center; color:var(--sub); font-size:0.8rem;">No activity yet.</p>';

      // Render Rates
      document.getElementById('listRates').innerHTML = (cur.acts || []).map(a => `
        <div class="item">
          <div><strong>${a.name}</strong> <span class="tag">${a.type}</span><br><small style="color:var(--sub);">₹${a.rate} per ${a.unit}</small></div>
        </div>
      `).join('');

      // Render Levels
      document.getElementById('listLevels').innerHTML = (cur.lvls || []).map(l => `
        <div class="item">
          <div><strong>Lvl ${l.lvl}: ${l.title}</strong><br><small style="color:var(--sub);">Target: ₹${l.target}</small></div>
        </div>
      `).join('');

      // Render Notes
      document.getElementById('notesContainer').innerHTML = (cur.notes || []).map((n, i) => `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>${n.title}</strong>
            <button class="del" onclick="deleteNote(${i})">✕</button>
          </div>
          <p style="font-size:0.85rem; margin-top:6px; white-space:pre-wrap;">${n.content}</p>
        </div>
      `).join('') || '<p style="text-align:center; color:var(--sub); font-size:0.8rem;">No notes saved.</p>';
    }

    function switchProfile(name) {
      if (store.profiles[name]) {
        store.activeProfile = name;
        persist();
        updateUI();
      }
    }

    function addProfile() {
      const name = document.getElementById('newProfileName').value.trim();
      if (!name || name === "undefined" || name === "1") return;
      if (!store.profiles[name]) {
        store.profiles[name] = JSON.parse(JSON.stringify(defaultState.profiles.Default));
        store.activeProfile = name;
        persist();
        updateUI();
        closeModal('manageModal');
        document.getElementById('newProfileName').value = "";
      }
    }

    function handleQuestSubmit(e) {
      e.preventDefault();
      const cur = getCur();
      const actId = parseInt(document.getElementById('selectQuestAct').value);
      const qty = parseFloat(document.getElementById('questQty').value);
      const act = cur.acts.find(a => a.id === actId);
      if (!act) return;

      const amt = act.rate * qty;
      if (act.type === 'Earn') cur.balance += amt;
      else cur.balance -= amt;

      cur.logs.unshift({
        name: act.name,
        type: act.type,
        amount: amt,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      persist();
      updateUI();
      e.target.reset();
    }

    function handleNoteSubmit(e) {
      e.preventDefault();
      const cur = getCur();
      cur.notes = cur.notes || [];
      cur.notes.unshift({
        title: document.getElementById('noteTitle').value,
        content: document.getElementById('noteContent').value
      });
      persist();
      updateUI();
      e.target.reset();
    }

    function deleteNote(i) {
      const cur = getCur();
      cur.notes.splice(i, 1);
      persist();
      updateUI();
      }
          // --- Auth Handling (Mobile Optimized Redirect) ---
    function toggleAuth() {
      if (!auth) return alert("Firebase Auth initialization failed.");
      if (currentUser) {
        auth.signOut().then(() => {
          currentUser = null;
          updateUI();
        });
      } else {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithRedirect(provider);
      }
    }

    if (auth) {
      auth.getRedirectResult().catch(e => {
        if (e && e.message) alert("Login Error: " + e.message);
      });

      auth.onAuthStateChanged(u => {
        currentUser = u;
        const ui = document.getElementById("userInfo");
        const ab = document.getElementById("authBtn");
        if (u) {
          ui.innerHTML = `<img src="${u.photoURL || ''}" class="user-avatar"><span>${u.displayName ? u.displayName.split(' ')[0] : 'Hero'}</span>`;
          ab.innerText = "Logout";
          db.collection("users").doc(u.uid).get().then(doc => {
            if (doc.exists) { 
              store = doc.data(); 
              setTheme(store.theme || 'default');
              updateUI(); 
            } else {
              persist();
            }
          });
        } else {
          ui.innerHTML = `<span>🔒 Guest</span>`;
          ab.innerText = "Login";
        }
      });
    }

    // Init Call
    if (store.theme) setTheme(store.theme);
    updateUI();
  </script>
</body>
</html>
