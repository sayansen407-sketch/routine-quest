<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoutineQuest Pro Cloud</title>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg: #070d19;
    --card: rgba(17, 24, 39, 0.9);
    --border: rgba(56, 189, 248, 0.25);
    --primary: #38bdf8;
    --primary-glow: rgba(56, 189, 248, 0.4);
    --earn: #10b981;
    --spend: #f43f5e;
    --gold: #fbbf24;
    --text: #f8fafc;
    --sub: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: radial-gradient(circle at top, #1e293b, #070d19 80%); color: var(--text); padding: 14px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
  
  /* Auth Bar */
  .auth-bar { display: flex; align-items: center; justify-content: space-between; background: rgba(15,23,42,0.85); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; }
  .user-info { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
  .user-avatar { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--primary); }
  .auth-btn { background: var(--primary); color: #070d19; font-weight: 800; font-size: 0.8rem; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  .logout-btn { background: rgba(244,63,94,0.2); color: var(--spend); border: 1px solid rgba(244,63,94,0.4); }

  .bar { display: flex; align-items: center; justify-content: space-between; background: rgba(15,23,42,0.8); padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; }
  .bar select { background: transparent; border: none; color: var(--primary); font-size: 0.95rem; font-weight: bold; outline: none; cursor: pointer; }
  .plus-btn { background: var(--primary); color: #070d19; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; font-weight: bold; border: none; cursor: pointer; }
  
  .card { background: var(--card); backdrop-filter: blur(12px); padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .wallet { text-align: center; }
  .badge { display: inline-block; font-size: 0.85rem; color: #000; background: linear-gradient(135deg, #d97706, var(--gold)); padding: 5px 14px; border-radius: 20px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
  .balance { font-size: 2.6rem; font-weight: 900; text-shadow: 0 0 16px var(--primary-glow); margin-bottom: 8px; }
  .prog-bg { width: 100%; height: 10px; background: #0f172a; border-radius: 20px; overflow: hidden; }
  .prog-fill { height: 100%; background: linear-gradient(90deg, #0284c7, var(--primary)); width: 0%; transition: width 0.4s ease; }
  .prog-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--sub); margin-top: 6px; }
  
  /* Tabs */
  .nav { display: flex; gap: 6px; background: rgba(15,23,42,0.7); padding: 5px; border-radius: 12px; margin-bottom: 12px; }
  .nav button { flex: 1; padding: 10px 0; background: transparent; color: var(--sub); border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .nav button.active { background: var(--primary); color: #070d19; }
  .tab { display: none; }
  .tab.active { display: block; }
  
  h3 { font-size: 1.1rem; margin-bottom: 12px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: #090e17; color: #fff; font-size: 0.95rem; outline: none; }
  .btn { padding: 13px; background: linear-gradient(135deg, var(--primary), #0284c7); color: #070d19; font-weight: 900; border: none; border-radius: 10px; cursor: pointer; }
  
  /* Lists & Daily Summary Cards */
  .list { max-height: 280px; overflow-y: auto; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #090e17; border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); }
  .earn { color: var(--earn); font-weight: bold; }
  .spend { color: var(--spend); font-weight: bold; }
  .del { background: rgba(244,63,94,0.15); color: var(--spend); border: 1px solid rgba(244,63,94,0.3); padding: 5px 8px; border-radius: 6px; cursor: pointer; }

  /* Report Card Styles */
  .summary-card { background: #090e17; border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .summary-header { display: flex; justify-content: space-between; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; margin-bottom: 8px; font-size: 0.9rem; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; font-size: 0.8rem; }
</style>
</head>
<body>

<div class="auth-bar">
  <div class="user-info" id="userInfo"><span>🔒 Guest (Offline)</span></div>
  <button class="auth-btn" id="authBtn" onclick="toggleAuth()">Sign in with Google</button>
</div>

<div class="bar">
  <select id="saveSelector" onchange="switchProfile(this.value)"></select>
  <button class="plus-btn" onclick="addProfile()">+</button>
</div>

<div class="card wallet">
  <div class="badge" id="levelBadge">Level 1 - Novice</div>
  <div style="font-size:0.75rem; color:var(--sub); text-transform:uppercase;">Net Balance</div>
  <div class="balance" id="walletBalance">₹ 0.00</div>
  <div class="prog-bg"><div class="prog-fill" id="progressFill"></div></div>
  <div class="prog-meta"><span>XP Target</span><span id="progressText">0 / 500</span></div>
</div>

<div class="nav">
  <button class="active" onclick="switchTab('tabLog', this)">Activity</button>
  <button onclick="switchTab('tabReport', this)">Daily Report</button>
  <button onclick="switchTab('tabRates', this)">Rates</button>
  <button onclick="switchTab('tabLevels', this)">Levels</button>
</div>

<!-- Tab 1: Activity -->
<div id="tabLog" class="tab active card">
  <h3>Record Activity</h3>
  <form id="formLog">
    <select id="selectAct" required></select>
    <input type="number" id="inputDuration" placeholder="Count / Duration (e.g. 1 or 30)" step="any" required>
    <button type="submit" class="btn">+ Add Record</button>
  </form>
  <h3 style="margin-top:16px;">Recent Logs</h3>
  <div class="list" id="listHistory"></div>
</div>

<!-- Tab 2: Daily Report & Summaries -->
<div id="tabReport" class="tab card">
  <h3>Daily Performance Summary</h3>
  <div id="reportList" style="max-height: 380px; overflow-y: auto;"></div>
</div>

<!-- Tab 3: Rates -->
<div id="tabRates" class="tab card">
  <h3>Add Rate</h3>
  <form id="formRate">
    <input type="text" id="rateName" placeholder="Activity Name" required>
    <div style="display:flex; gap:8px;">
      <select id="rateType"><option value="Earn">Earn (+)</option><option value="Spend">Spend (-)</option></select>
      <input type="number" id="rateVal" placeholder="₹ Rate" step="any" required>
    </div>
    <select id="rateUnit">
      <option value="Task">Per 1 Task / Session</option>
      <option value="1 Min">Per 1 Minute</option>
      <option value="1 Hr">Per 1 Hour</option>
      <option value="1 Day">Per 1 Day</option>
      <option value="1 Week">Per 1 Week</option>
    </select>
    <button type="submit" class="btn">Save Rate</button>
  </form>
  <h3 style="margin-top:16px;">Configured Rates</h3>
  <div class="list" id="listRates"></div>
</div>

<!-- Tab 4: Levels -->
<div id="tabLevels" class="tab card">
  <h3>Define Level</h3>
  <form id="formLevel">
    <div style="display:flex; gap:8px;">
      <input type="number" id="lvlNum" placeholder="Level #" required style="flex:1;">
      <input type="number" id="lvlTgt" placeholder="Target ₹" required style="flex:2;">
    </div>
    <input type="text" id="lvlTitle" placeholder="Title/Badge" required>
    <button type="submit" class="btn">Save Level</button>
  </form>
  <h3 style="margin-top:16px;">Levels</h3>
  <div class="list" id="listLevels"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDZ7JwsMsB4KERLbq2NrzWn17Bq4LxVSqY",
  authDomain: "routine-quest-8613f.firebaseapp.com",
  projectId: "routine-quest-8613f",
  storageBucket: "routine-quest-8613f.firebasestorage.app",
  messagingSenderId: "461797030515",
  appId: "1:461797030515:web:071645a001e08f228a4806",
  measurementId: "G-JW5KHNGRC8"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let store = JSON.parse(localStorage.getItem('rq_db')) || {
  active: "Default",
  profiles: {
    "Default": {
      balance: 0,
      acts: [
        { id: 1, name: "Focus Work", type: "Earn", rate: 50, unit: "Task" },
        { id: 2, name: "Reading", type: "Earn", rate: 2, unit: "1 Min" },
        { id: 3, name: "Distraction", type: "Spend", rate: 30, unit: "Task" }
      ],
      lvls: [
        { lvl: 1, title: "Novice", target: 500 },
        { lvl: 2, title: "Disciplined", target: 1500 },
        { lvl: 3, title: "Master", target: 3500 }
      ],
      logs: []
    }
  }
};

function getCur() { return store.profiles[store.active]; }

// Strict Indian Standard Time (IST) Date Formatter
function getIndianDateTime() {
  const now = new Date();
  
  // Strict Asia/Kolkata date
  const dateOnly = now.toLocaleDateString('en-IN', {
    timeZone: 'Asia/Kolkata',
    day: '2-digit',
    month: 'short',
    year: 'numeric'
  });

  // Strict Asia/Kolkata time (12-hour AM/PM)
  const timeOnly = now.toLocaleTimeString('en-IN', {
    timeZone: 'Asia/Kolkata',
    hour: '2-digit',
    minute: '2-digit',
    hour12: true
  });

  return {
    dateOnly: dateOnly,
    timeString: `${dateOnly} • ${timeOnly}`
  };
}

async function persist() {
  localStorage.setItem('rq_db', JSON.stringify(store));
  if (currentUser && db) {
    try {
      await db.collection("users").doc(currentUser.uid).set(store);
    } catch (err) {
      console.error("Sync error:", err);
    }
  }
  updateUI();
}

auth.onAuthStateChanged(async (user) => {
  currentUser = user;
  const info = document.getElementById("userInfo");
  const btn = document.getElementById("authBtn");

  if (user) {
    info.innerHTML = `
      <img class="user-avatar" src="${user.photoURL || 'https://via.placeholder.com/28'}" alt="Avatar">
      <span>${user.displayName ? user.displayName.split(' ')[0] : 'User'}</span>
    `;
    btn.innerText = "Logout";
    btn.classList.add("logout-btn");

    try {
      const doc = await db.collection("users").doc(user.uid).get();
      if (doc.exists) {
        store = doc.data();
        localStorage.setItem('rq_db', JSON.stringify(store));
      } else {
        await db.collection("users").doc(user.uid).set(store);
      }
    } catch (err) {
      console.error("Fetch error:", err);
    }
  } else {
    info.innerHTML = `<span>🔒 Guest (Offline)</span>`;
    btn.innerText = "Sign in with Google";
    btn.classList.remove("logout-btn");
  }
  updateUI();
});

function toggleAuth() {
  if (currentUser) {
    auth.signOut();
  } else {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => alert("Sign-in issue: " + err.message));
  }
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function addProfile() {
  let name = prompt("Profile Name:");
  if (!name || !name.trim() || store.profiles[name.trim()]) return;
  name = name.trim();
  store.profiles[name] = {
    balance: 0,
    acts: [{ id: 1, name: "Task", type: "Earn", rate: 20, unit: "Task" }],
    lvls: [{ lvl: 1, title: "Beginner", target: 500 }],
    logs: []
  };
  store.active = name;
  persist();
}

function switchProfile(name) {
  if (store.profiles[name]) { store.active = name; persist(); }
}

function renderDailyReports(logs) {
  const container = document.getElementById('reportList');
  if (!logs || logs.length === 0) {
    container.innerHTML = '<p style="color:var(--sub);font-size:0.85rem;">No activity recorded yet.</p>';
    return;
  }

  const grouped = {};
  logs.forEach(log => {
    const dateKey = log.dateOnly || "Earlier";
    if (!grouped[dateKey]) grouped[dateKey] = { earn: 0, spend: 0, count: 0 };
    if (log.type === 'Earn') grouped[dateKey].earn += log.amt;
    else grouped[dateKey].spend += log.amt;
    grouped[dateKey].count++;
  });

  container.innerHTML = Object.keys(grouped).map(date => {
    const d = grouped[date];
    const net = d.earn - d.spend;
    return `
      <div class="summary-card">
        <div class="summary-header">
          <span>📅 ${date}</span>
          <span style="color:var(--sub); font-size:0.75rem;">${d.count} action(s)</span>
        </div>
        <div class="summary-grid">
          <div><span style="color:var(--sub);">Earned</span><br><b class="earn">+₹${d.earn.toFixed(1)}</b></div>
          <div><span style="color:var(--sub);">Spent</span><br><b class="spend">-₹${d.spend.toFixed(1)}</b></div>
          <div><span style="color:var(--sub);">Net</span><br><b style="color:${net >= 0 ? 'var(--earn)' : 'var(--spend)'}">${net >= 0 ? '+' : ''}₹${net.toFixed(1)}</b></div>
        </div>
      </div>
    `;
  }).join('');
}

function updateUI() {
  let cur = getCur();
  
  const selector = document.getElementById('saveSelector');
  selector.innerHTML = Object.keys(store.profiles).map(k => `<option value="${k}" ${k===store.active?'selected':''}>📂 ${k}</option>`).join('');

  document.getElementById('walletBalance').innerText = `₹ ${cur.balance.toFixed(2)}`;

  cur.lvls.sort((a,b) => a.lvl - b.lvl);
  let currentLvl = cur.lvls[0];
  for (let l of cur.lvls) { if (cur.balance >= l.target) currentLvl = l; }

  document.getElementById('levelBadge').innerText = `Level ${currentLvl.lvl} : ${currentLvl.title}`;
  let pct = Math.min(100, Math.max(0, (cur.balance / currentLvl.target) * 100));
  document.getElementById('progressFill').style.width = `${pct}%`;
  document.getElementById('progressText').innerText = `${cur.balance.toFixed(0)} / ${currentLvl.target}`;

  document.getElementById('selectAct').innerHTML = cur.acts.map(a => `<option value="${a.id}">${a.name} (${a.type==='Earn'?'+':'-'}₹${a.rate}/${a.unit})</option>`).join('');

  // History with Indian Standard Time
  document.getElementById('listHistory').innerHTML = cur.logs.length === 0 ? '<p style="color:var(--sub);font-size:0.8rem;">No records yet.</p>' :
    cur.logs.map((h, i) => `
      <div class="item">
        <div>
          <strong>${h.name}</strong> 
          <small style="color:var(--sub); font-size:0.75rem;">(${h.qty} ${h.unit})</small>
          <div style="font-size:0.7rem; color:var(--sub); margin-top:2px;">🕒 ${h.timeString || h.dateOnly || 'Earlier'}</div>
        </div>
        <div>
          <span class="${h.type==='Earn'?'earn':'spend'}">${h.type==='Earn'?'+':'-'}₹${h.amt.toFixed(2)}</span>
          <button class="del" onclick="delLog(${i})">✕</button>
        </div>
      </div>`).join('');

  renderDailyReports(cur.logs);

  document.getElementById('listRates').innerHTML = cur.acts.map((a, i) => `
    <div class="item">
      <div><strong>${a.name}</strong> <small style="color:var(--sub);">(${a.unit})</small></div>
      <div><span class="${a.type==='Earn'?'earn':'spend'}">₹${a.rate}</span> <button class="del" onclick="delRate(${i})">✕</button></div>
    </div>`).join('');

  document.getElementById('listLevels').innerHTML = cur.lvls.map((l, i) => `
    <div class="item">
      <div><strong>Lvl ${l.lvl}: ${l.title}</strong></div>
      <div>Target: ₹${l.target} <button class="del" onclick="delLvl(${i})">✕</button></div>
    </div>`).join('');
}

document.getElementById('formLog').onsubmit = (e) => {
  e.preventDefault();
  let cur = getCur();
  let id = parseInt(document.getElementById('selectAct').value);
  let qty = parseFloat(document.getElementById('inputDuration').value);
  let act = cur.acts.find(a => a.id === id);
  let total = act.rate * qty;
  
  if (act.type === 'Earn') cur.balance += total; else cur.balance -= total;

  // Real Indian Date & Time
  const ist = getIndianDateTime();

  cur.logs.unshift({
    name: act.name,
    type: act.type,
    amt: total,
    qty: qty,
    unit: act.unit,
    timestamp: Date.now(),
    dateOnly: ist.dateOnly,
    timeString: ist.timeString
  });

  persist();
  document.getElementById('inputDuration').value = '';
};

document.getElementById('formRate').onsubmit = (e) => {
  e.preventDefault();
  let cur = getCur();
  cur.acts.push({
    id: Date.now(),
    name: document.getElementById('rateName').value,
    type: document.getElementById('rateType').value,
    rate: parseFloat(document.getElementById('rateVal').value),
    unit: document.getElementById('rateUnit').value
  });
  persist();
  document.getElementById('formRate').reset();
};

document.getElementById('formLevel').onsubmit = (e) => {
  e.preventDefault();
  let cur = getCur();
  cur.lvls.push({
    lvl: parseInt(document.getElementById('lvlNum').value),
    target: parseFloat(document.getElementById('lvlTgt').value),
    title: document.getElementById('lvlTitle').value
  });
  persist();
  document.getElementById('formLevel').reset();
};

function delLog(i) {
  let cur = getCur();
  let item = cur.logs[i];
  if (item.type === 'Earn') cur.balance -= item.amt; else cur.balance += item.amt;
  cur.logs.splice(i, 1);
  persist();
}

function delRate(i) {
  let cur = getCur();
  if (cur.acts.length <= 1) return alert("Must keep at least 1 rate!");
  cur.acts.splice(i, 1);
  persist();
}

function delLvl(i) {
  let cur = getCur();
  if (cur.lvls.length <= 1) return alert("Must keep at least 1 level!");
  cur.lvls.splice(i, 1);
  persist();
}

updateUI();
</script>
</body>
</html>
