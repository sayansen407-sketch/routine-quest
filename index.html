<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoutineQuest Pro Cloud</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: radial-gradient(circle at top, #1e293b, #070d19 80%);
    --card: rgba(17, 24, 39, 0.95);
    --input: #090e17;
    --border: rgba(56, 189, 248, 0.25);
    --primary: #38bdf8;
    --earn: #10b981;
    --spend: #f43f5e;
    --gold: #fbbf24;
    --silver: #94a3b8;
    --bronze: #d97706;
    --text: #f8fafc;
    --sub: #94a3b8;
  }
  body.theme-pitch-dark { --bg: #000; --card: #0a0a0a; --input: #141414; --border: #262626; --primary: #fff; --text: #fff; --sub: #888; }
  body.theme-slate-grey { --bg: #1e293b; --card: #0f172a; --input: #0b1120; --border: #334155; --primary: #94a3b8; --text: #f1f5f9; --sub: #94a3b8; }
  body.theme-light-white { --bg: #f8fafc; --card: #fff; --input: #f1f5f9; --border: #cbd5e1; --primary: #0284c7; --text: #0f172a; --sub: #64748b; }
  body.theme-warm-paper { --bg: #faf7f2; --card: #fff; --input: #f5efe6; --border: #e2d9cc; --primary: #b45309; --text: #292524; --sub: #78716c; }
  body.theme-ice-silver { --bg: #eef2f6; --card: #fff; --input: #e2e8f0; --border: #cbd5e1; --primary: #475569; --text: #1e293b; --sub: #64748b; }
  body.theme-crimson-red { --bg: radial-gradient(circle at top, #3b0714, #0a0204 80%); --card: #170408; --input: #0a0204; --border: rgba(244,63,94,0.3); --primary: #f43f5e; --text: #fff1f2; --sub: #fda4af; }
  body.theme-emerald-green { --bg: radial-gradient(circle at top, #022c22, #02120e 80%); --card: #041c16; --input: #02120e; --border: rgba(16,185,129,0.3); --primary: #10b981; --text: #ecfdf5; --sub: #6ee7b7; }
  body.theme-royal-purple { --bg: radial-gradient(circle at top, #2e1065, #0f051d 80%); --card: #170b2c; --input: #0f051d; --border: rgba(168,85,247,0.3); --primary: #a855f7; --text: #faf5ff; --sub: #d8b4fe; }
  body.theme-sunset-gold { --bg: radial-gradient(circle at top, #451a03, #0c0401 80%); --card: #1c0a02; --input: #0c0401; --border: rgba(245,158,11,0.35); --primary: #f59e0b; --text: #fffbeb; --sub: #fcd34d; }
  body.theme-deep-teal { --bg: radial-gradient(circle at top, #042f2e, #021414 80%); --card: #051d1d; --input: #021414; --border: rgba(20,184,166,0.35); --primary: #14b8a6; --text: #f0fdfa; --sub: #5eead4; }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 12px; max-width: 500px; margin: 0 auto; min-height: 100vh; position: relative; }
  .top-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; position: relative; }
  .menu-btn { background: var(--card); border: 1px solid var(--border); color: var(--primary); font-size: 1.2rem; cursor: pointer; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .menu-dropdown { display: none; position: absolute; left: 0; top: 42px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); z-index: 60; min-width: 190px; flex-direction: column; }
  .menu-dropdown.show { display: flex; }
  .menu-dropdown button { background: transparent; border: none; color: var(--text); padding: 10px 14px; text-align: left; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .auth-box { flex: 1; display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); }
  .user-info { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
  .user-avatar { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--primary); }
  .auth-btn { background: var(--primary); color: #000; font-weight: 800; font-size: 0.75rem; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  .bar { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 10px; }
  .bar select { background: transparent; border: none; color: var(--primary); font-size: 0.9rem; font-weight: bold; outline: none; }
  .plus-btn { background: var(--primary); color: #000; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; border: none; cursor: pointer; }
  .card { background: var(--card); padding: 14px; border-radius: 14px; margin-bottom: 10px; border: 1px solid var(--border); }
  .wallet { text-align: center; }
  .badge-row { display: flex; justify-content: center; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .badge { font-size: 0.75rem; color: #000; background: linear-gradient(135deg, #d97706, var(--gold)); padding: 3px 10px; border-radius: 20px; font-weight: 800; }
  .streak-badge { font-size: 0.75rem; background: rgba(245,158,11,0.15); border: 1px solid #f59e0b; color: #f59e0b; padding: 3px 8px; border-radius: 20px; font-weight: bold; }
  .rank-badge { font-size: 0.72rem; padding: 2px 6px; border-radius: 10px; font-weight: 900; }
  .rank-1 { background: var(--gold); color: #000; }
  .rank-2 { background: var(--silver); color: #000; }
  .rank-3 { background: var(--bronze); color: #fff; }
  .balance { font-size: 2.3rem; font-weight: 900; margin-bottom: 6px; }
  .prog-bg { width: 100%; height: 7px; background: #0f172a; border-radius: 20px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
  .target-box { background: rgba(15,23,42,0.5); padding: 6px 10px; border-radius: 8px; border: 1px dashed var(--border); margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
  .target-btn { background: rgba(56,189,248,0.15); border: 1px solid var(--primary); color: var(--primary); padding: 3px 6px; border-radius: 5px; font-size: 0.72rem; cursor: pointer; font-weight: bold; }
  .nav { display: flex; gap: 4px; background: var(--card); padding: 4px; border-radius: 10px; margin-bottom: 10px; overflow-x: auto; border: 1px solid var(--border); }
  .nav button { flex: 1; padding: 8px 4px; background: transparent; color: var(--sub); border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.75rem; white-space: nowrap; }
  .nav button.active { background: var(--primary); color: #000; }
  .tab { display: none; }
  .tab.active { display: block; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 14px; }
  .modal.show { display: flex; }
  .modal-body { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 420px; padding: 14px; max-height: 80vh; overflow-y: auto; }
  form { display: flex; flex-direction: column; gap: 8px; }
  input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: var(--input); color: var(--text); font-size: 0.85rem; outline: none; }
  .btn { padding: 10px; background: var(--primary); color: #000; font-weight: 900; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
  .filter-bar { display: flex; gap: 4px; margin-bottom: 10px; background: var(--input); padding: 3px; border-radius: 6px; }
  .filter-btn { flex: 1; background: transparent; border: none; color: var(--sub); padding: 5px 0; font-size: 0.72rem; font-weight: 800; cursor: pointer; border-radius: 4px; }
  .filter-btn.active { background: var(--primary); color: #000; }
  .chart-box { position: relative; width: 100%; height: 180px; margin-bottom: 12px; }
  .list { max-height: 250px; overflow-y: auto; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: var(--input); border-radius: 8px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.05); }
  .earn { color: var(--earn); font-weight: bold; }
  .spend { color: var(--spend); font-weight: bold; }
  .tag { font-size: 0.65rem; padding: 1px 5px; border-radius: 4px; background: rgba(56,189,248,0.15); color: var(--primary); margin-left: 4px; }
  .del { background: rgba(244,63,94,0.15); color: var(--spend); border: 1px solid rgba(244,63,94,0.3); padding: 4px 6px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; }
  .folder-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
  .folder-btn { background: var(--input); border: 1px solid var(--border); color: var(--sub); padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; }
  .folder-btn.active { background: var(--primary); color: #000; font-weight: bold; }
</style>
</head>
<body>

<div class="top-header">
  <button class="menu-btn" onclick="toggleMenu()">⋮</button>
  <div class="menu-dropdown" id="menuDropdown">
    <button onclick="openModal('manageModal')">📋 Manage & Delete Logs</button>
    <button onclick="openModal('themeModal')">🎨 Change Theme</button>
  </div>
  <div class="auth-box">
    <div class="user-info" id="userInfo"><span>🔒 Guest</span></div>
    <button class="auth-btn" id="authBtn" onclick="toggleAuth()">Login</button>
  </div>
</div>

<div class="bar">
  <select id="saveSelector" onchange="switchProfile(this.value)"></select>
  <button class="plus-btn" onclick="addProfile()">+</button>
</div>

<div class="card wallet">
  <div class="badge-row">
    <span class="badge" id="levelBadge">Level 1 : Novice</span>
    <span class="streak-badge" id="streakBadge">🔥 0 Days</span>
    <span class="rank-badge" id="rankBadge" style="display:none;"></span>
  </div>
  <div style="font-size:0.7rem; color:var(--sub); text-transform:uppercase;">Net Balance</div>
  <div class="balance" id="walletBalance">₹ 0.00</div>
  <div class="prog-bg"><div class="prog-fill" id="progressFill"></div></div>
  <div class="target-box">
    <span>Target: <b id="dailyTargetDisplay" style="color:var(--earn);">₹100</b> | Today: <b id="todayEarnedDisplay">₹0</b></span>
    <button class="target-btn" onclick="changeDailyTarget()">Edit</button>
  </div>
</div>

<div class="nav">
  <button class="active" onclick="switchTab('tabLog', this)">Activity</button>
  <button onclick="switchTab('tabCharts', this)">Charts</button>
  <button onclick="switchTab('tabReport', this)">Report</button>
  <button onclick="switchTab('tabNotes', this)">Notes</button>
  <button onclick="switchTab('tabCategories', this)">Category</button>
  <button onclick="switchTab('tabRates', this)">Rates</button>
  <button onclick="switchTab('tabLevels', this)">Levels</button>
</div>

<div id="tabLog" class="tab active card">
  <form id="formLog">
    <input type="text" id="actSearchInput" placeholder="🔍 Search activity..." oninput="filterActivities()">
    <select id="selectAct" required></select>
    <input type="number" id="inputDuration" placeholder="Count / Duration" step="any" required>
    <button type="submit" class="btn">+ Add Record</button>
  </form>
  <h4 style="margin-top:12px; font-size:0.85rem;">Recent Logs (Protected)</h4>
  <div class="list" id="listHistory"></div>
</div>

<div id="tabCharts" class="tab card">
  <div class="filter-bar">
    <button class="filter-btn" onclick="setChartFilter('1D', this)">1D</button>
    <button class="filter-btn active" onclick="setChartFilter('1W', this)">1W</button>
    <button class="filter-btn" onclick="setChartFilter('1M', this)">1M</button>
    <button class="filter-btn" onclick="setChartFilter('1Y', this)">1Y</button>
    <button class="filter-btn" onclick="setChartFilter('ALL', this)">ALL</button>
  </div>
  <div class="chart-box"><canvas id="trendChart"></canvas></div>
  <h4 style="font-size:0.8rem; margin:8px 0 4px;">🔥 Streak Consistency</h4>
  <div class="chart-box" style="height:140px;"><canvas id="streakChart"></canvas></div>
  <h4 style="font-size:0.8rem; margin:8px 0 4px;">Category Breakdown</h4>
  <div class="chart-box" style="height:140px;"><canvas id="categoryChart"></canvas></div>
</div>

<div id="tabReport" class="tab card">
  <h4 style="margin-bottom:8px; font-size:0.85rem;">Daily Performance Summary</h4>
  <div id="reportList" class="list"></div>
</div>

<div id="tabNotes" class="tab card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <h4 style="font-size:0.85rem;">Folders & Notes</h4>
    <button class="target-btn" onclick="createFolder()">+ Folder</button>
  </div>
  <div class="folder-nav" id="folderList"></div>
  <form id="formNote" style="margin-bottom:10px;">
    <input type="text" id="noteTitle" placeholder="Title" required>
    <textarea id="noteContent" rows="2" placeholder="Write note..." required></textarea>
    <button type="submit" class="btn">+ Save Note</button>
  </form>
  <div id="notesContainer" class="list"></div>
</div>

<div id="tabCategories" class="tab card">
  <form id="formCategory">
    <input type="text" id="catInput" placeholder="Category Name" required>
    <button type="submit" class="btn">+ Add Category</button>
  </form>
  <div class="list" id="listCategories"></div>
</div>

<div id="tabRates" class="tab card">
  <form id="formRate">
    <input type="text" id="rateName" placeholder="Activity Name" required>
    <select id="rateCategorySelect"></select>
    <div style="display:flex; gap:6px;">
      <select id="rateType"><option value="Earn">Earn (+)</option><option value="Spend">Spend (-)</option></select>
      <input type="number" id="rateVal" placeholder="₹ Rate" step="any" required>
    </div>
    <select id="rateUnit">
      <option value="Task">Per Task</option>
      <option value="1 Min">Per Min</option>
      <option value="1 Hr">Per Hour</option>
    </select>
    <button type="submit" class="btn">Save Rate</button>
  </form>
  <div class="list" id="listRates"></div>
</div>

<div id="tabLevels" class="tab card">
  <form id="formLevel">
    <div style="display:flex; gap:6px;">
      <input type="number" id="lvlNum" placeholder="Lvl #" required>
      <input type="number" id="lvlTgt" placeholder="Target ₹" required>
    </div>
    <input type="text" id="lvlTitle" placeholder="Badge Title" required>
    <button type="submit" class="btn">Save Level</button>
  </form>
  <div class="list" id="listLevels"></div>
</div>

<div class="modal" id="manageModal">
  <div class="modal-body">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <h4>Manage & Delete Logs</h4>
      <button class="target-btn" onclick="closeModal('manageModal')">✕</button>
    </div>
    <div class="list" id="manageLogsList"></div>
  </div>
</div>

<div class="modal" id="themeModal">
  <div class="modal-body">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h4>Appearance & Themes</h4>
      <button class="target-btn" onclick="closeModal('themeModal')">✕</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:6px;">
      <button class="btn" style="background:#070d19; color:#38bdf8; border:1px solid #38bdf8;" onclick="setTheme('default')">Cyber Midnight (Default)</button>
      <button class="btn" style="background:#000; color:#fff; border:1px solid #333;" onclick="setTheme('theme-pitch-dark')">Pitch Dark (OLED)</button>
      <button class="btn" style="background:#1e293b; color:#94a3b8;" onclick="setTheme('theme-slate-grey')">Slate Grey</button>
      <button class="btn" style="background:#fff; color:#000;" onclick="setTheme('theme-light-white')">Minimal White</button>
      <button class="btn" style="background:#faf7f2; color:#292524;" onclick="setTheme('theme-warm-paper')">Warm Paper</button>
      <button class="btn" style="background:#eef2f6; color:#1e293b;" onclick="setTheme('theme-ice-silver')">Ice Silver</button>
      <button class="btn" style="background:#170408; color:#f43f5e;" onclick="setTheme('theme-crimson-red')">Crimson Red</button>
      <button class="btn" style="background:#041c16; color:#10b981;" onclick="setTheme('theme-emerald-green')">Emerald Green</button>
      <button class="btn" style="background:#170b2c; color:#a855f7;" onclick="setTheme('theme-royal-purple')">Royal Purple</button>
      <button class="btn" style="background:#1c0a02; color:#f59e0b;" onclick="setTheme('theme-sunset-gold')">Sunset Gold</button>
      <button class="btn" style="background:#051d1d; color:#14b8a6;" onclick="setTheme('theme-deep-teal')">Deep Teal</button>
    </div>
  </div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDZ7JwsMsB4KERLbq2NrzWn17Bq4LxVSqY",
  authDomain: "routine-quest-8613f.firebaseapp.com",
  projectId: "routine-quest-8613f",
  storageBucket: "routine-quest-8613f.firebasestorage.app",
  messagingSenderId: "461797030515",
  appId: "1:461797030515:web:071645a001e08f228a4806",
  measurementId: "G-JW5KHNGRC8"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let trendChart = null;
let streakChart = null;
let catChart = null;
let chartFilter = '1W';
let activeFolder = "General";

let store = JSON.parse(localStorage.getItem('rq_db')) || {
  active: "Default",
  theme: "default",
  categories: ["General", "Study", "Fitness", "Work", "Distraction"],
  folders: ["General", "Ideas"],
  notes: [],
  profiles: {
    "Default": {
      balance: 0,
      streak: 0,
      dailyTarget: 100,
      lastActiveDate: "",
      streakHistory: {},
      acts: [
        { id: 1, name: "Focus Work", category: "Work", type: "Earn", rate: 50, unit: "Task" },
        { id: 2, name: "Reading", category: "Study", type: "Earn", rate: 2, unit: "1 Min" },
        { id: 3, name: "Distraction", category: "Distraction", type: "Spend", rate: 30, unit: "Task" }
      ],
      lvls: [
        { lvl: 1, title: "Novice", target: 500 },
        { lvl: 2, title: "Disciplined", target: 1500 },
        { lvl: 3, title: "Master", target: 3500 }
      ],
      logs: []
    }
  }
};

if (!store.categories) store.categories = ["General", "Study", "Fitness", "Work", "Distraction"];
if (!store.folders) store.folders = ["General", "Ideas"];
if (!store.notes) store.notes = [];

function getCur() {
  if (!store.profiles[store.active]) store.active = Object.keys(store.profiles)[0] || "Default";
  const cur = store.profiles[store.active];
  if (!cur.dailyTarget) cur.dailyTarget = 100;
  if (!cur.streakHistory) cur.streakHistory = {};
  if ((!cur.logs || cur.logs.length === 0) && cur.balance <= 0) {
    cur.balance = 0;
    cur.streak = 0;
    cur.lastActiveDate = "";
    cur.streakHistory = {};
  }
  return cur;
}

function applyTheme() {
  document.body.className = '';
  if (store.theme && store.theme !== 'default') document.body.classList.add(store.theme);
}

function setTheme(t) {
  store.theme = t;
  applyTheme();
  persist();
  closeModal('themeModal');
}

function toggleMenu() { document.getElementById('menuDropdown').classList.toggle('show'); }
window.addEventListener('click', (e) => {
  if (!e.target.matches('.menu-btn')) {
    const m = document.getElementById('menuDropdown');
    if (m && m.classList.contains('show')) m.classList.remove('show');
  }
});

function openModal(id) {
  const m = document.getElementById('menuDropdown');
  if (m) m.classList.remove('show');
  if (id === 'manageModal') renderManageList();
  document.getElementById(id).classList.add('show');
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function getIST() {
  const now = new Date();
  const dateOnly = now.toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric' });
  const timeOnly = now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true });
  const isoDate = now.toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
  return { dateOnly, timeString: `${dateOnly} • ${timeOnly}`, isoDate };
}

function getTodayEarned() {
  const cur = getCur();
  const today = getIST().dateOnly;
  return (cur.logs || []).filter(l => l.dateOnly === today && l.type === 'Earn').reduce((s, l) => s + l.amt, 0);
}

function checkStreak() {
  const cur = getCur();
  const todayIso = getIST().isoDate;
  if (getTodayEarned() >= cur.dailyTarget) {
    if (cur.lastActiveDate !== todayIso) {
      if (!cur.lastActiveDate) cur.streak = 1;
      else {
        const diff = Math.round((new Date(todayIso) - new Date(cur.lastActiveDate)) / 86400000);
        if (diff === 1) cur.streak += 1;
        else if (diff > 1) cur.streak = 1;
      }
      cur.lastActiveDate = todayIso;
    }
    cur.streakHistory[todayIso] = cur.streak;
  }
}

function recalcStreakOnDelete(dOnly, dIso) {
  const cur = getCur();
  const iso = dIso || getIST().isoDate;
  const dayEarn = (cur.logs || []).filter(l => (l.dateOnly === dOnly || l.isoDate === iso) && l.type === 'Earn').reduce((s, l) => s + l.amt, 0);
  if (dayEarn < cur.dailyTarget) {
    delete cur.streakHistory[iso];
    if (cur.lastActiveDate === iso) {
      const rem = Object.keys(cur.streakHistory).sort();
      if (rem.length > 0) {
        const prev = rem[rem.length - 1];
        cur.lastActiveDate = prev;
        cur.streak = cur.streakHistory[prev] || 0;
      } else {
        cur.lastActiveDate = "";
        cur.streak = 0;
      }
    }
  }
}

function getLeaderboard() {
  const cur = getCur();
  if (!cur.streak || cur.streak === 0) return null;
  const list = Object.keys(store.profiles).map(n => ({ n, s: store.profiles[n].streak || 0 })).filter(p => p.s > 0).sort((a, b) => b.s - a.s);
  if (!list.length) return null;
  if (list[0] && list[0].s === cur.streak) return { t: "🥇 1st Highest", c: "rank-1" };
  if (list[1] && list[1].s === cur.streak) return { t: "🥈 2nd Highest", c: "rank-2" };
  if (list[2] && list[2].s === cur.streak) return { t: "🥉 3rd Highest", c: "rank-3" };
  return null;
}

function changeDailyTarget() {
  const cur = getCur();
  let v = prompt("Set Daily Target ₹:", cur.dailyTarget || 100);
  if (v && !isNaN(v) && parseFloat(v) > 0) {
    cur.dailyTarget = parseFloat(v);
    checkStreak();
    persist();
  }
}

async function persist() {
  localStorage.setItem('rq_db', JSON.stringify(store));
  if (currentUser && db) {
    try { await db.collection("users").doc(currentUser.uid).set(store); } catch (e) { console.error(e); }
  }
  updateUI();
}

auth.onAuthStateChanged(async (user) => {
  currentUser = user;
  const info = document.getElementById("userInfo");
  const btn = document.getElementById("authBtn");
  if (user) {
    info.innerHTML = `<img class="user-avatar" src="${user.photoURL || 'https://via.placeholder.com/24'}"><span>${user.displayName ? user.displayName.split(' ')[0] : 'User'}</span>`;
    btn.innerText = "Logout";
    try {
      const doc = await db.collection("users").doc(user.uid).get();
      if (doc.exists) {
        store = doc.data();
        if (!store.categories) store.categories = ["General", "Study", "Fitness", "Work", "Distraction"];
        if (!store.folders) store.folders = ["General", "Ideas"];
        if (!store.notes) store.notes = [];
        localStorage.setItem('rq_db', JSON.stringify(store));
      } else await db.collection("users").doc(user.uid).set(store);
    } catch (err) { console.error(err); }
  } else {
    info.innerHTML = `<span>🔒 Guest</span>`;
    btn.innerText = "Login";
  }
  applyTheme();
  updateUI();
});

function toggleAuth() {
  if (currentUser) auth.signOut();
  else auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert(e.message));
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if (id === 'tabCharts') renderCharts();
}

function addProfile() {
  let n = prompt("Profile Name:");
  if (!n || !n.trim() || store.profiles[n.trim()]) return;
  n = n.trim();
  store.profiles[n] = {
    balance: 0, streak: 0, dailyTarget: 100, lastActiveDate: "", streakHistory: {},
    acts: [{ id: 1, name: "Task", category: "General", type: "Earn", rate: 20, unit: "Task" }],
    lvls: [{ lvl: 1, title: "Beginner", target: 500 }], logs: []
  };
  store.active = n;
  persist();
}

function switchProfile(n) { if (store.profiles[n]) { store.active = n; persist(); } }

function createFolder() {
  let n = prompt("Folder Name:");
  if (!n || !n.trim() || store.folders.includes(n.trim())) return;
  store.folders.push(n.trim());
  activeFolder = n.trim();
  persist();
}

document.getElementById('formNote').onsubmit = (e) => {
  e.preventDefault();
  const t = document.getElementById('noteTitle').value.trim();
  const c = document.getElementById('noteContent').value.trim();
  if (!t || !c) return;
  store.notes.unshift({ id: Date.now(), folder: activeFolder, title: t, content: c, time: getIST().timeString });
  persist();
  document.getElementById('formNote').reset();
};

function delNote(id) {
  if (confirm("Delete note?")) {
    store.notes = store.notes.filter(n => n.id !== id);
    persist();
  }
}

function renderNotes() {
  document.getElementById('folderList').innerHTML = store.folders.map(f => `
    <button class="folder-btn ${f === activeFolder ? 'active' : ''}" onclick="activeFolder='${f}';renderNotes();">📁 ${f}</button>
  `).join('');
  const list = store.notes.filter(n => n.folder === activeFolder);
  document.getElementById('notesContainer').innerHTML = !list.length ? '<p style="color:var(--sub);font-size:0.75rem;padding:6px;">No notes.</p>' :
    list.map(n => `
      <div class="item" style="flex-direction:column; align-items:flex-start; gap:4px;">
        <div style="display:flex; justify-content:space-between; width:100%;">
          <strong style="color:var(--primary);">${n.title}</strong>
          <button class="del" onclick="delNote(${n.id})">✕</button>
        </div>
        <div style="font-size:0.75rem; white-space:pre-wrap;">${n.content}</div>
        <small style="color:var(--sub); font-size:0.65rem;">🕒 ${n.time}</small>
      </div>
    `).join('');
}

document.getElementById('formCategory').onsubmit = (e) => {
  e.preventDefault();
  let c = document.getElementById('catInput').value.trim();
  if (!c || store.categories.includes(c)) return;
  store.categories.push(c);
  persist();
  document.getElementById('catInput').value = '';
};

function delCat(i) {
  if (store.categories.length <= 1) return alert("Keep at least 1!");
  store.categories.splice(i, 1);
  persist();
}

function filterActivities() {
  const q = (document.getElementById('actSearchInput').value || '').toLowerCase();
  const cur = getCur();
  const filtered = cur.acts.filter(a => a.name.toLowerCase().includes(q) || (a.category && a.category.toLowerCase().includes(q)));
  document.getElementById('selectAct').innerHTML = !filtered.length ? '<option value="">No match</option>' :
    filtered.map(a => `<option value="${a.id}">[${a.category || 'General'}] ${a.name} (${a.type==='Earn'?'+':'-'}₹${a.rate}/${a.unit})</option>`).join('');
}

function setChartFilter(f, btn) {
  chartFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCharts();
}

function renderCharts() {
  const cur = getCur();
  const now = Date.now();
  let limit = Infinity;
  if (chartFilter === '1D') limit = 86400000;
  else if (chartFilter === '1W') limit = 7 * 86400000;
  else if (chartFilter === '1M') limit = 30 * 86400000;
  else if (chartFilter === '1Y') limit = 365 * 86400000;

  const logs = (cur.logs || []).filter(l => (now - (l.timestamp || now)) <= limit).slice().reverse();
  let cum = 0;
  const labels = [];
  const data = [];
  const catDist = {};

  logs.forEach(l => {
    cum += (l.type === 'Earn' ? l.amt : -l.amt);
    labels.push(l.timeString ? l.timeString.split('•')[1] : 'Log');
    data.push(cum);
    const cat = l.category || 'General';
    catDist[cat] = (catDist[cat] || 0) + l.amt;
  });

  if (!data.length) { labels.push("Now"); data.push(cur.balance); }

  const ctxT = document.getElementById('trendChart').getContext('2d');
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(ctxT, {
    type: 'line',
    data: { labels, datasets: [{ data, borderColor: '#38bdf8', borderWidth: 2, fill: true, backgroundColor: 'rgba(56,189,248,0.1)', tension: 0.3, pointRadius: 2 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: 'rgba(255,255,255,0.05)' } } } }
  });

  const ctxS = document.getElementById('streakChart').getContext('2d');
  if (streakChart) streakChart.destroy();
  const sKeys = Object.keys(cur.streakHistory || {}).slice(-7);
  streakChart = new Chart(ctxS, {
    type: 'bar',
    data: { labels: sKeys.length ? sKeys : ['Today'], datasets: [{ data: sKeys.length ? sKeys.map(k => cur.streakHistory[k]) : [cur.streak || 0], backgroundColor: '#f59e0b', borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { stepSize: 1, grid: { color: 'rgba(255,255,255,0.05)' } } } }
  });

  const ctxC = document.getElementById('categoryChart').getContext('2d');
  if (catChart) catChart.destroy();
  const cK = Object.keys(catDist);
  catChart = new Chart(ctxC, {
    type: 'doughnut',
    data: { labels: cK.length ? cK : ['None'], datasets: [{ data: cK.length ? Object.values(catDist) : [1], backgroundColor: ['#38bdf8', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#64748b'], borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 9 }, color: '#94a3b8' } } } }
  });
}

function renderReports() {
  const cur = getCur();
  const grp = {};
  (cur.logs || []).forEach(l => {
    const k = l.dateOnly || "Earlier";
    if (!grp[k]) grp[k] = { e: 0, s: 0, c: 0 };
    if (l.type === 'Earn') grp[k].e += l.amt; else grp[k].s += l.amt;
    grp[k].c++;
  });
  document.getElementById('reportList').innerHTML = !Object.keys(grp).length ? '<p style="color:var(--sub);font-size:0.75rem;">No logs.</p>' :
    Object.keys(grp).map(d => `
      <div class="item" style="flex-direction:column; align-items:flex-start; gap:4px;">
        <div style="display:flex; justify-content:space-between; width:100%;"><strong>📅 ${d}</strong><small style="color:var(--sub);">${grp[d].c} actions</small></div>
        <div style="display:flex; justify-content:space-between; width:100%; font-size:0.75rem;">
          <span class="earn">+₹${grp[d].e.toFixed(1)}</span>
          <span class="spend">-₹${grp[d].s.toFixed(1)}</span>
          <b>Net: ₹${(grp[d].e - grp[d].s).toFixed(1)}</b>
        </div>
      </div>
    `).join('');
}

function renderManageList() {
  const cur = getCur();
  document.getElementById('manageLogsList').innerHTML = !cur.logs.length ? '<p style="color:var(--sub);font-size:0.75rem;">No records.</p>' :
    cur.logs.map((h, i) => `
      <div class="item">
        <div><strong>${h.name}</strong> <small style="color:var(--sub);">(${h.timeString})</small></div>
        <div>
          <span class="${h.type==='Earn'?'earn':'spend'}">${h.type==='Earn'?'+':'-'}₹${h.amt.toFixed(1)}</span>
          <button class="del" onclick="delLog(${i})">Delete</button>
        </div>
      </div>
    `).join('');
}

function delLog(i) {
  if (!confirm("Are you sure? This recalculates Balance, Streak & Charts.")) return;
  const cur = getCur();
  const it = cur.logs[i];
  if (it.type === 'Earn') cur.balance -= it.amt; else cur.balance += it.amt;
  const dOnly = it.dateOnly;
  const dIso = it.isoDate;
  cur.logs.splice(i, 1);
  if (it.type === 'Earn') recalcStreakOnDelete(dOnly, dIso);
  persist();
  renderManageList();
}

function updateUI() {
  const cur = getCur();
  document.getElementById('saveSelector').innerHTML = Object.keys(store.profiles).map(k => `<option value="${k}" ${k===store.active?'selected':''}>📂 ${k}</option>`).join('');
  document.getElementById('walletBalance').innerText = `₹ ${cur.balance.toFixed(2)}`;
  document.getElementById('streakBadge').innerText = `🔥 ${cur.streak || 0} Days`;

  const r = getLeaderboard();
  const rb = document.getElementById('rankBadge');
  if (r) { rb.style.display = "inline-block"; rb.innerText = r.t; rb.className = `rank-badge ${r.c}`; }
  else rb.style.display = "none";

  document.getElementById('dailyTargetDisplay').innerText = `₹${cur.dailyTarget || 100}`;
  document.getElementById('todayEarnedDisplay').innerText = `₹${getTodayEarned().toFixed(0)}`;

  cur.lvls.sort((a,b) => a.lvl - b.lvl);
  let lvl = cur.lvls[0];
  for (let l of cur.lvls) { if (cur.balance >= l.target) lvl = l; }
  document.getElementById('levelBadge').innerText = `Level ${lvl.lvl} : ${lvl.title}`;
  document.getElementById('progressFill').style.width = `${Math.min(100, Math.max(0, (cur.balance / lvl.target) * 100))}%`;

  filterActivities();
  document.getElementById('rateCategorySelect').innerHTML = store.categories.map(c => `<option value="${c}">${c}</option>`).join('');

  document.getElementById('listHistory').innerHTML = !cur.logs.length ? '<p style="color:var(--sub);font-size:0.75rem;">No activity.</p>' :
    cur.logs.slice(0, 10).map(h => `
      <div class="item">
        <div><strong>${h.name}</strong><span class="tag">${h.category || 'General'}</span> <small style="color:var(--sub);">(${h.timeString})</small></div>
        <span class="${h.type==='Earn'?'earn':'spend'}">${h.type==='Earn'?'+':'-'}₹${h.amt.toFixed(1)}</span>
      </div>
    `).join('');

  document.getElementById('listCategories').innerHTML = store.categories.map((c, i) => `
    <div class="item"><span>🏷️ ${c}</span><button class="del" onclick="delCat(${i})">✕</button></div>
  `).join('');

  document.getElementById('listRates').innerHTML = cur.acts.map((a, i) => `
    <div class="item">
      <div><strong>${a.name}</strong> <small style="color:var(--sub);">(${a.unit})</small></div>
      <div><span class="${a.type==='Earn'?'earn':'spend'}">₹${a.rate}</span> <button class="del" onclick="if(cur.acts.length>1){cur.acts.splice(${i},1);persist();}">✕</button></div>
    </div>
  `).join('');

  document.getElementById('listLevels').innerHTML = cur.lvls.map((l, i) => `
    <div class="item">
      <div><strong>Lvl ${l.lvl}: ${l.title}</strong></div>
      <div>Target: ₹${l.target} <button class="del" onclick="if(cur.lvls.length>1){cur.lvls.splice(${i},1);persist();}">✕</button></div>
    </div>
  `).join('');

  renderReports();
  renderNotes();
}

document.getElementById('formLog').onsubmit = (e) => {
  e.preventDefault();
  const cur = getCur();
  const id = parseInt(document.getElementById('selectAct').value);
  if (!id) return alert("Select an activity!");
  const qty = parseFloat(document.getElementById('inputDuration').value);
  const act = cur.acts.find(a => a.id === id);
  const total = act.rate * qty;

  if (act.type === 'Earn') cur.balance += total; else cur.balance -= total;
  const ist = getIST();
  cur.logs.unshift({
    name: act.name, category: act.category || "General", type: act.type,
    amt: total, qty, unit: act.unit, timestamp: Date.now(),
    dateOnly: ist.dateOnly, timeString: ist.timeString, isoDate: ist.isoDate
  });
  if (act.type === 'Earn') checkStreak();
  persist();
  document.getElementById('inputDuration').value = '';
};

document.getElementById('formRate').onsubmit = (e) => {
  e.preventDefault();
  const cur = getCur();
  cur.acts.push({
    id: Date.now(), name: document.getElementById('rateName').value,
    category: document.getElementById('rateCategorySelect').value,
    type: document.getElementById('rateType').value,
    rate: parseFloat(document.getElementById('rateVal').value),
    unit: document.getElementById('rateUnit').value
  });
  persist();
  document.getElementById('formRate').reset();
};

document.getElementById('formLevel').onsubmit = (e) => {
  e.preventDefault();
  const cur = getCur();
  cur.lvls.push({
    lvl: parseInt(document.getElementById('lvlNum').value),
    target: parseFloat(document.getElementById('lvlTgt').value),
    title: document.getElementById('lvlTitle').value
  });
  persist();
  document.getElementById('formLevel').reset();
};

applyTheme();
updateUI();
</script>
</body>
</html>
